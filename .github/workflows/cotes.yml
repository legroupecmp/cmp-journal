name: Cotes du bandeau

on:
  schedule:
    # Toutes les 10 minutes, tous les jours (le Bitcoin se négocie 24 h sur 24)
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cotes
  cancel-in-progress: true

jobs:
  cotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/cotes.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
